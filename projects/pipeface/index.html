    /* Layout: full-bleed specimen stage, thin control rail pinned at the bottom */
    :root {
      --bg: #eeeef0;
      --ink: #141418;
      --muted: #6c6c78;
      --rule: #d2d2d8;
      --accent: #3a46ff;
      --panel: #f7f7f9;
      --f-display: "Pipeface", system-ui, sans-serif;
      --f-ui: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #101014;
        --ink: #f0f0f4;
        --muted: #8a8a98;
        --rule: #2a2a32;
        --accent: #8a92ff;
        --panel: #17171c;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #101014;
      --ink: #f0f0f4;
      --muted: #8a8a98;
      --rule: #2a2a32;
      --accent: #8a92ff;
      --panel: #17171c;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-ui);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      padding-block: 14px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    header b {
      color: var(--ink);
      font-weight: 500;
    }

    #readout {
      font-variant-numeric: tabular-nums;
    }

    #stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      cursor: crosshair;
      touch-action: none;
      overflow: hidden;
    }

    #text {
      font-family: var(--f-display);
      font-size: var(--size, 160px);
      line-height: var(--lead, 1.05);
      text-align: center;
      --pad: .5em;
      overflow-wrap: anywhere;
      user-select: none;
      max-width: 100%;
    }

    /* Each glyph box is padded on all sides and pulled back with negative margins.
   Layout is unchanged, but the paint area now covers ink that spills past the
   em box (descenders, overhangs), so changing ANGL repaints cleanly. */
    #text span {
      display: inline-block;
      white-space: pre;
      font-variation-settings: "ANGL" 50;
      position: relative;
      padding: var(--pad);
      margin: calc(-1 * var(--pad)) calc(var(--track, 0em) - var(--pad)) calc(-1 * var(--pad)) calc(-1 * var(--pad));
    }

    #text br {
      display: block;
    }

    #text span .v {
      position: absolute;
      left: 50%;
      top: calc(100% - var(--pad));
      transform: translateX(-50%);
      font: 500 10px/1 var(--f-ui);
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      display: none;
      padding-top: 4px;
      font-variation-settings: normal;
    }

    #stage.show-values #text span .v {
      display: block;
    }

    #cursorline {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }

    #stage.show-line.active #cursorline {
      opacity: .5;
    }

    #drop {
      position: absolute;
      inset: 12px;
      border: 1.5px dashed var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .1em;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      pointer-events: none;
    }

    [hidden] {
      display: none !important;
    }

    #controls {
      border-top: 1px solid var(--rule);
      background: var(--panel);
      display: grid;
      grid-template-columns: minmax(180px, 2fr) repeat(5, minmax(100px, 1fr));
      gap: 14px 22px;
      align-items: end;
      padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field label {
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .field label output {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    textarea {
      resize: vertical;
      min-height: 34px;
      max-height: 120px;
      line-height: 1.4;
      display: block;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 7px 9px;
      width: 100%;
    }

    textarea:focus-visible,
    input[type="range"]:focus-visible,
    button:focus-visible,
    input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .toggles {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toggles label {
      display: flex;
      gap: 6px;
      align-items: center;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      margin: 0;
    }

    button {
      font: inherit;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #controls .toggles-row {
      grid-column: 1 / -1;
    }

    @media (max-width: 1100px) {
      #controls {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      #controls .wide {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      #controls {
        grid-template-columns: 1fr 1fr;
      }

      #controls .wide {
        grid-column: 1 / -1;
      }
    }
  </style>

</head>

<body>
  <header>
    <span><b id="fontname">Pipeface</b> &nbsp;·&nbsp; axis ANGL 0–100</span>
    <span id="readout">cursor —</span>
  </header>

  <main id="stage" class="show-line">
    <div id="cursorline"></div>
    <div id="text" aria-live="polite"></div>
    <div id="drop" hidden>Drop a .ttf / .woff2 to swap the font</div>
  </main>

  <section id="controls">
    <div class="field wide">
      <label for="input">Text</label>
      <textarea id="input" rows="1" spellcheck="false" autocomplete="off">Pipeface</textarea>
    </div>
    <div class="field">
      <label for="size">Size <output id="sizeOut">160px</output></label>
      <input id="size" type="range" min="24" max="400" value="160">
    </div>
    <div class="field">
      <label for="lead">Leading <output id="leadOut">1.05</output></label>
      <input id="lead" type="range" min="40" max="250" value="105">
    </div>
    <div class="field">
      <label for="track">Tracking <output id="trackOut">0</output></label>
      <input id="track" type="range" min="-300" max="600" step="5" value="0">
    </div>
    <div class="field">
      <label for="reach">Reach <output id="reachOut">400px</output></label>
      <input id="reach" type="range" min="20" max="1600" value="400">
    </div>
    <div class="field">
      <label for="ease">Smoothing <output id="easeOut">0.15</output></label>
      <input id="ease" type="range" min="1" max="100" value="15">
    </div>
    <div class="field wide toggles-row">
      <div class="toggles">
        <label><input id="vals" type="checkbox"> Values</label>
        <label><input id="line" type="checkbox" checked> Cursor line</label>
        <label><input id="curve" type="checkbox" checked> Soft curve</label>
        <button id="fontBtn" type="button">Swap font</button>
        <input id="file" type="file" accept=".ttf,.otf,.woff,.woff2" hidden>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const stage = $("stage"), textEl = $("text"), line = $("cursorline");
      const state = { x: null, reach: 400, ease: 0.15, soft: true, chars: [] };

      // Build one span per character
      function build(str) {
        textEl.textContent = "";
        state.chars = [];
        for (const ch of Array.from(str || " ")) {
          if (ch === "\n") { textEl.appendChild(document.createElement("br")); continue; }
          const s = document.createElement("span");
          s.textContent = ch;
          const v = document.createElement("i"); v.className = "v"; v.textContent = "50";
          if (ch.trim()) s.appendChild(v);
          textEl.appendChild(s);
          state.chars.push({ el: s, v, cur: 50, target: 50, cx: 0 });
        }
        measure();
      }

      // Cache each glyph's horizontal centre (relative to the stage)
      function measure() {
        const sr = stage.getBoundingClientRect();
        for (const c of state.chars) {
          const r = c.el.getBoundingClientRect();
          c.cx = r.left + r.width / 2 - sr.left;
        }
      }

      // d < 0: glyph is left of cursor -> toward 100. d > 0: right -> toward 0. d = 0 -> 50.
      function angleFor(d) {
        const t = d / state.reach;
        const k = state.soft ? Math.tanh(t * 1.5) : Math.max(-1, Math.min(1, t));
        return 50 - 50 * k;
      }

      function setPointer(clientX) {
        const sr = stage.getBoundingClientRect();
        state.x = clientX - sr.left;
        line.style.left = state.x + "px";
        stage.classList.add("active");
      }
      function clearPointer() { state.x = null; stage.classList.remove("active"); $("readout").textContent = "cursor —"; }

      stage.addEventListener("pointermove", e => setPointer(e.clientX));
      stage.addEventListener("pointerdown", e => setPointer(e.clientX));
      stage.addEventListener("pointerleave", clearPointer);
      window.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") clearPointer(); });

      function tick() {
        let nearest = null, nd = Infinity;
        for (const c of state.chars) {
          if (state.x === null) c.target = 50;
          else {
            const d = c.cx - state.x;
            c.target = angleFor(d);
            if (Math.abs(d) < nd && c.v.isConnected) { nd = Math.abs(d); nearest = c; }
          }
          c.cur += (c.target - c.cur) * state.ease;
          if (Math.abs(c.target - c.cur) < 0.01) c.cur = c.target;
          const val = Math.round(c.cur * 10) / 10;
          if (val !== c.last) {
            c.el.style.fontVariationSettings = `"ANGL" ${val}`;
            c.v.textContent = Math.round(val);
            c.last = val;
          }
        }
        if (nearest) $("readout").textContent = `x ${Math.round(state.x)}px · nearest “${nearest.el.firstChild.textContent}” ANGL ${Math.round(nearest.cur)}`;
        requestAnimationFrame(tick);
      }

      // Controls
      const bindRange = (id, fn) => { const el = $(id); const run = () => fn(+el.value); el.addEventListener("input", run); run(); };
      bindRange("size", v => { textEl.style.setProperty("--size", v + "px"); $("sizeOut").textContent = v + "px"; requestAnimationFrame(measure); });
      bindRange("lead", v => { textEl.style.setProperty("--lead", (v / 100).toFixed(2)); $("leadOut").textContent = (v / 100).toFixed(2); requestAnimationFrame(measure); });
      bindRange("track", v => { textEl.style.setProperty("--track", (v / 1000) + "em"); $("trackOut").textContent = v; requestAnimationFrame(measure); });
      bindRange("reach", v => { state.reach = v; $("reachOut").textContent = v + "px"; });
      bindRange("ease", v => { state.ease = v / 100; $("easeOut").textContent = (v / 100).toFixed(2); });
      $("input").addEventListener("input", e => build(e.target.value));
      $("vals").addEventListener("change", e => stage.classList.toggle("show-values", e.target.checked));
      $("line").addEventListener("change", e => stage.classList.toggle("show-line", e.target.checked));
      $("curve").addEventListener("change", e => state.soft = e.target.checked);

      // Font swapping (button or drag-and-drop) for testing new builds
      async function loadFont(file) {
        try {
          const buf = await file.arrayBuffer();
          const face = new FontFace("PipefaceLocal", buf);
          await face.load();
          document.fonts.add(face);
          textEl.style.fontFamily = `"PipefaceLocal", var(--f-display)`;
          $("fontname").textContent = file.name.replace(/\.[^.]+$/, "");
          requestAnimationFrame(measure);
        } catch (err) {
          $("fontname").textContent = "Couldn't load that font file";
        }
      }
      $("fontBtn").addEventListener("click", () => $("file").click());
      $("file").addEventListener("change", e => e.target.files[0] && loadFont(e.target.files[0]));
      let dragDepth = 0;
      window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("drop").hidden = false; });
      window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").hidden = true; } });
      window.addEventListener("dragover", e => e.preventDefault());
      window.addEventListener("drop", e => {
        e.preventDefault(); dragDepth = 0; $("drop").hidden = true;
        const f = e.dataTransfer.files[0]; if (f) loadFont(f);
      });

      window.addEventListener("resize", measure);
      if (window.ResizeObserver) new ResizeObserver(measure).observe(textEl);

      build($("input").value);
      document.fonts.ready.then(measure);
      requestAnimationFrame(tick);
    })();
  </script>

</body>

</html>
