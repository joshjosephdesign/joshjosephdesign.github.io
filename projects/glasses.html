  :root {
    --ink: #121212;
    --muted: #8a877f;
    --line: #e2dfd8;
    --paper: #ffffff;
    --well: #f2efe8;
    --on-ink: #ffffff;
    --sw-gap: #ffffff;
    --backdrop: rgba(250,249,246,.82);
    --ar: 1.7778;
    --stage-w: min(1180px, calc(100vw - 64px), calc((100vh - 245px) * var(--ar)));
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #efece6; --muted: #8f8b83; --line: #34322e; --paper: #141413; --well: #201f1d;
      --sw-gap: #55524c; --on-ink: #141413; --backdrop: rgba(10,10,10,.78); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #efece6; --muted: #8f8b83; --line: #34322e; --paper: #141413; --well: #201f1d;
    --sw-gap: #55524c; --on-ink: #141413; --backdrop: rgba(10,10,10,.78); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Ginto", system-ui, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 32px 24px;
  }
  .mono { font-family: "Ginto", sans-serif; }
  #theme {
    position: fixed; top: 14px; right: 16px; z-index: 10; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  #theme:hover { border-color: var(--ink); }
  #theme svg { width: 18px; height: 18px; }

  /* ---------- stage ---------- */
  .stage-wrap { position: relative; width: var(--stage-w); aspect-ratio: var(--ar); }
  #stage { width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; text-align: center; pointer-events: none;
  }
  .overlay > * { pointer-events: auto; }
  .overlay h1 { margin: 0; font-weight: 500; font-size: 22px; letter-spacing: -.01em; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 34ch; line-height: 1.45; }
  .btn {
    font: 500 13px/1 "Ginto", sans-serif; border: 1.5px solid var(--ink); background: var(--ink); color: var(--on-ink);
    border-radius: 999px; padding: 11px 18px; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:focus-visible, button:focus-visible { outline: 2px solid #3b6cf6; outline-offset: 3px; }
  #status {
    position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
    background: rgba(18,18,18,.78); color: #fff; font: 500 11px/1 "Ginto", sans-serif; letter-spacing: .06em;
    text-transform: uppercase; padding: 9px 13px; border-radius: 999px; transition: opacity .3s; white-space: nowrap;
    pointer-events: none;
  }
  #status.hide { opacity: 0; }
  #badge { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #badge text { font: 600 8.5px "Ginto", sans-serif; letter-spacing: .42em; fill: var(--muted); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .45s ease-out; }
  #flash.on { opacity: .85; transition: none; }

  /* ---------- controls ---------- */
  .controls {
    width: var(--stage-w); margin-top: 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "typer shutter side";
    gap: 36px; align-items: center;
  }
  .typer { grid-area: typer; }
  .side { grid-area: side; display: flex; justify-content: flex-end; align-items: center; gap: 30px; }
  .tools { grid-area: tools; }
  #shutter { grid-area: shutter; }
  #stack { grid-area: stack; }
  .typer { min-width: 0; position: relative; }
  .typer-head {
    display: flex; align-items: center; gap: 14px; height: 22px;
    font: 450 11px/1 "Ginto", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .sets { display: none; align-items: center; gap: 6px; color: var(--ink); }
  .sets.show { display: inline-flex; }
  .sets button {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer;
    font: 500 13px/1 "Ginto"; color: var(--ink); display: grid; place-items: center; padding: 0;
  }
  .sets button:hover { border-color: var(--ink); }
  .strip { position: relative; height: 96px; cursor: text; margin-top: 4px; }
  #stripCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  #txt {
    position: absolute; left: 0; top: 30px; width: 10px; height: 20px; opacity: 0; border: 0; padding: 0;
    pointer-events: none; font-size: 16px;
  }
  .notches { position: relative; z-index: 2; pointer-events: none; height: calc(var(--nh, 52px) + 6px); }
  .notch {
    position: absolute; top: 0; width: max(var(--nw, 38px), 30px); height: var(--nh, 52px); margin-left: calc(max(var(--nw, 38px), 30px) / -2);
    padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: start center; color: var(--ink);
    pointer-events: auto;
  }
  .notch::before {
    content: ""; width: var(--dot, 13px); height: var(--dot, 13px); border-radius: 50%; background: var(--ink); opacity: .32;
    margin-top: calc(var(--nh, 52px) * .46 - var(--dot, 13px) / 2); transition: transform .15s, opacity .15s;
  }
  .notch:hover::before { transform: scale(1.2); opacity: .7; }
  .notch.sel::before { display: none; }
  .notch svg { width: var(--nw, 38px); height: var(--nh, 52px); display: none; }
  .notch.sel svg { display: block; }
  .notch.faded { opacity: .3; }
  .notch.faded:hover { opacity: .65; }
  .eyes { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .eye { position: absolute; color: var(--ink); transform: translate(-50%, -50%); }
  .eye svg { display: block; width: 100%; height: auto; aspect-ratio: 17.53 / 9.63; }
  .eye.faded { opacity: .25; }

  .tools { display: flex; flex-direction: row; gap: 18px; align-items: center; }
  .tool-label { font: 450 11px/1 "Ginto", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .swatches { --hex: circle(50%); display: flex; flex-direction: column; align-items: center; }
  .hex-row { display: flex; gap: 5px; }
  .hex-row + .hex-row { margin-top: 0px; }
  .sw {
    width: 31px; height: 31px; padding: 3px; border: 0; background: transparent; cursor: pointer; display: block;
    clip-path: var(--hex); position: relative; transition: transform .12s;
  }
  .sw:hover { transform: scale(1.06); }
  .sw > span { display: block; width: 100%; height: 100%; padding: 1px; clip-path: var(--hex); background: var(--line); }
  .sw > span > i { display: block; width: 100%; height: 100%; clip-path: var(--hex); background-size: cover; position: relative; }
  .sw[aria-pressed="true"] { background: var(--ink); }
  .sw[aria-pressed="true"] > span { background: var(--sw-gap); padding: 2px; }
  .sw.custom i { background: conic-gradient(#e53, #eb3, #5c5, #3be, #64e, #e4a, #e53); }
  .sw.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
  .vslider { display: flex; flex-direction: column; align-items: center; gap: 9px; touch-action: none; cursor: pointer; flex: none; border-radius: 8px; }
  .vslider:focus-visible { outline: 2px solid #3b6cf6; outline-offset: 4px; }
  .vtrack { position: relative; width: 20px; height: var(--sh, 92px); }
  .vtrack::before, .vfill { content: ""; position: absolute; left: 50%; width: 1.2px; transform: translateX(-50%); }
  .vtrack::before { top: 0; bottom: 0; background: var(--line); }
  .vfill { bottom: 0; background: var(--ink); }
  .vknob { position: absolute; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transform: translate(-50%, 50%); transition: width .12s, height .12s; }
  .vslider:hover .vknob, .vslider:active .vknob { width: 15px; height: 15px; }

  #shutter {
    width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); cursor: pointer;
    position: relative; flex: none; margin-top: 12px;
  }
  #shutter::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--ink); transition: transform .12s; }
  #shutter:hover::after { transform: scale(.94); }
  #shutter:active::after { transform: scale(.86); }
  #shutter:disabled { opacity: .3; cursor: default; }

  #stack {
    --sw: 168px; width: var(--sw); height: calc(var(--sw) / var(--ar)); position: relative; border: 0; padding: 0; background: none;
    cursor: pointer; flex: none;
  }
  #stack img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: transform .25s;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.14));
  }
  #stack:hover img:nth-last-child(1) { transform: translateY(-4px) rotate(0deg); }
  #stack .empty {
    position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    font: 450 11px/1.4 "Ginto", sans-serif; letter-spacing: .06em; text-transform: uppercase;
    border: 1.5px dashed var(--line); border-radius: 12px;
  }
  #stack .count {
    position: absolute; right: -8px; top: -8px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--ink);
    color: var(--on-ink); font: 500 11px/24px "Ginto", sans-serif; padding: 0 7px; z-index: 5;
  }

  /* ---------- gallery ---------- */
  dialog {
    border: 0; padding: 0; width: min(1100px, calc(100vw - 64px)); max-height: calc(100vh - 64px);
    border-radius: 18px; background: var(--paper); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(4px); }
  .g-head {
    display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--paper); z-index: 2;
  }
  .g-head h2 { margin: 0; font-size: 16px; font-weight: 500; }
  .g-head .actions { display: flex; gap: 10px; }
  .g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; padding: 22px; }
  .g-item { display: flex; flex-direction: column; gap: 8px; }
  .g-item img { width: 100%; display: block; }
  .g-item .row { display: flex; justify-content: space-between; align-items: center; font: 450 11px/1 "Ginto", sans-serif; color: var(--muted); }
  .g-item .row div { display: flex; gap: 12px; }
  .g-item a, .g-item button { font: 500 11px/1 "Ginto", sans-serif; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .g-empty { padding: 60px; text-align: center; color: var(--muted); }

  /* medium: typing line on its own row, then tools · shutter · photos */
  @media (max-width: 1180px) {
    .controls { grid-template-columns: 1fr auto 1fr; grid-template-areas: "typer typer typer" "tools shutter stack"; row-gap: 20px; }
    .side { display: contents; }
    .tools { justify-self: start; }
    #stack { justify-self: end; }
    #shutter { margin-top: 0; }
  }

  /* phone */
  @media (max-width: 760px) {
    html, body { overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; left: 0; right: 0; top: 0; height: var(--app-h, 100dvh); min-height: 0;
      padding: max(12px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
      justify-content: center;
    }
    .stage-wrap { flex: none; }
    #theme { position: static; width: 28px; height: 28px; margin-left: auto; flex: none; }
    #theme svg { width: 15px; height: 15px; }
    /* keyboard up: just the TV and the typing line */
    body.kb .tools, body.kb #shutter, body.kb #stack { display: none; }
    body.kb .controls { grid-template-areas: "typer typer typer"; }
    .overlay h1 { font-size: 18px; }
    .overlay p { font-size: 13px; padding: 0 16px; }
    #badge text { font-size: 7px; letter-spacing: .36em; }
    .controls { width: min(calc(100vw - 24px), 480px); margin-top: 24px; column-gap: 10px; row-gap: 4px; flex: none;
      grid-template-columns: 1fr auto 1fr; grid-template-areas: "typer typer typer" "stack shutter tools"; }
    .typer-head { height: 28px; }
    .strip { height: 72px; }
    .tools { justify-self: end; gap: 10px; }
    .sw { width: 27px; height: 27px; padding: 2.5px; }
    .hex-row { gap: 4px; }
    .vtrack { --sh: 72px; width: 16px; }
    .vknob { width: 11px; height: 11px; }
    #shutter { width: 58px; height: 58px; }
    #stack { --sw: 58px; height: 58px; justify-self: start; }
    #stack img { object-fit: cover; border-radius: 10px; }
    #stack .empty { font-size: 8px; line-height: 1.3; text-align: center; padding: 4px; border-radius: 10px; }
    #stack .count { right: -6px; top: -6px; }
    dialog { width: calc(100vw - 24px); max-height: calc(100svh - 24px); border-radius: 14px; }
    .g-head { padding: 14px 16px; }
    .g-head .btn { padding: 9px 13px; }
    .g-grid { grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px; }
  }
</style>

   ========================================================= */
const fontBytes = Uint8Array.from(atob(FONT_B64), c => c.charCodeAt(0));
const hb = hbjs(await createHarfBuzz());
const hbFont = hb.createFont(hb.createFace(hb.createBlob(fontBytes.buffer), 0));

const glyphCache = new Map();
function glyph(gid) {
  let e = glyphCache.get(gid);
  if (!e) {
    const d = hbFont.glyphToPath(gid) || '';
    const nums = (d.match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || []).map(Number);
    let y0 = Infinity, y1 = -Infinity;
    for (let i = 1; i < nums.length; i += 2) { y0 = Math.min(y0, nums[i]); y1 = Math.max(y1, nums[i]); }
    const pts = []; for (let i = 0; i + 1 < nums.length; i += 2) pts.push([nums[i], nums[i + 1]]);
    e = { path: new Path2D(d), y0, y1, pts, empty: !d };
    glyphCache.set(gid, e);
  }
  return e;
}

function shapeRaw(text) {
  const buf = hb.createBuffer();
  buf.addText(text); buf.guessSegmentProperties();
  hb.shape(hbFont, buf);
  const out = buf.json(); buf.destroy();
  return out;
}

// Vertical metrics of the whole font + typical lens centre (from medial forms)
const FONT_Y = (() => {
  let top = -Infinity, bot = Infinity; const centres = [], bots = [], tops = [], mediCY = {};
  const letters = 'abcdefghijklmnopqrstuvwxyz';
  for (const c of letters) {
    for (const s of [c, c + 'a', 'a' + c, 'a' + c + 'a']) {
      for (const o of shapeRaw(s)) { const g = glyph(o.g); if (!g.empty) { top = Math.max(top, g.y1); bot = Math.min(bot, g.y0); } }
    }
    const mid = shapeRaw('a' + c + 'a')[1];
    if (mid) { const g = glyph(mid.g); centres.push((g.y0 + g.y1) / 2); bots.push(g.y0); tops.push(g.y1); mediCY[c] = (g.y0 + g.y1) / 2; }
  }
  const med = a => a.sort((x, y) => x - y)[a.length >> 1];
  return { top: top + 20, bot: bot - 20, lensCY: med(centres), lensBot: med(bots), lensTop: med(tops), mediCY };
})();

/* Layout model: words → lenses → bridges (glyph boundaries) */
function layout(text) {
  const raw = shapeRaw(text);
  let x = 0;
  const glyphs = raw.map(o => { const g = { gid: o.g, cl: o.cl, x, adv: o.ax, dx: o.dx, dy: o.dy }; x += o.ax; return g; });
  glyphs.forEach((g, i) => g.clEnd = i + 1 < glyphs.length ? glyphs[i + 1].cl : text.length);
  const words = [];
  let cur = null;
  for (const g of glyphs) {
    const isSpace = text[g.cl] === ' ';
    if (isSpace) { cur = null; continue; }
    if (!cur) { cur = { start: g.cl, end: g.clEnd, glyphs: [], lenses: [] }; words.push(cur); }
    cur.glyphs.push(g); cur.end = g.clEnd;
    const k = Math.max(1, g.clEnd - g.cl);              // ligatures hold k lenses
    for (let j = 0; j < k; j++) cur.lenses.push({ x0: g.x + g.adv * j / k, x1: g.x + g.adv * (j + 1) / k });
  }
  for (const w of words) {
    w.x0 = w.glyphs[0].x; const lg = w.glyphs[w.glyphs.length - 1]; w.x1 = lg.x + lg.adv;
    w.bridges = w.lenses.slice(0, -1).map((l, i) => ({ x: l.x1, pitch: ((l.x1 - l.x0) + (w.lenses[i + 1].x1 - w.lenses[i + 1].x0)) / 2 }));
  }
  return { glyphs, words, width: x, text };
}

function caretX(L, i) {
  for (const g of L.glyphs) {
    if (i <= g.cl) return g.x;
    if (i < g.clEnd) return g.x + g.adv * (i - g.cl) / (g.clEnd - g.cl);
  }
  return L.width;
}

class OneEuro {
  constructor(minCutoff, beta, dCutoff = 1) { Object.assign(this, { minCutoff, beta, dCutoff, x: null, dx: 0, t: 0 }); }
  a(cut, dt) { const r = 2 * Math.PI * cut * dt; return r / (r + 1); }

    const dv = (v - this.x) / dt;

    const cut = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += this.a(cut, dt) * (v - this.x);
    return this.x;
  }
}

    document.documentElement.style.setProperty('--ar', (stage.width / stage.height).toFixed(4)); return;
  }

  mid.addScaledVector(fwd, lift);

  const pos = [0, 1, 2].map(i => fPos[i].f(mid.getComponent(i), now));
  const r = new THREE.Vector3(...[0, 1, 2].map(i => fRight[i].f(right.getComponent(i), now))).normalize();
  let u = new THREE.Vector3(...[0, 1, 2].map(i => fUp[i].f(up.getComponent(i), now)));
  u.addScaledVector(r, -u.dot(r)).normalize();
  const f = new THREE.Vector3().crossVectors(r, u);
  const sIpd = fIpd.f(ipd, now);

  const s = sIpd * state.size / wornPitch;
  rig.matrix.makeBasis(r, u, f).scale(new THREE.Vector3(s, s, s)).setPosition(pos[0], pos[1], pos[2]);
  rig.matrixWorldNeedsUpdate = true;
}

/* =========================================================
   Compositing, TV frame, photos
   ========================================================= */
function tvPath(ctx, w, h) {
  const m = h * 0.016, r = Math.min(w, h) * 0.075;
  ctx.beginPath();
  ctx.moveTo(r, m);
  ctx.quadraticCurveTo(w / 2, -m, w - r, m);
  ctx.quadraticCurveTo(w - m, m, w - m, r);
  ctx.quadraticCurveTo(w + m, h / 2, w - m, h - r);
  ctx.quadraticCurveTo(w - m, h - m, w - r, h - m);
  ctx.quadraticCurveTo(w / 2, h + m, r, h - m);
  ctx.quadraticCurveTo(m, h - m, m, h - r);
  ctx.quadraticCurveTo(-m, h / 2, m, r);
  ctx.quadraticCurveTo(m, m, r, m);
  ctx.closePath();
}

let snapPending = false, well = cssVar('--well');
function drawScene(ctx, W, H, withGlasses) {
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(video, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, W, H); ctx.restore();
  if (withGlasses) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = W * 0.012; ctx.shadowOffsetY = H * 0.012; ctx.shadowOffsetX = W * 0.004;
    ctx.drawImage(renderer.domElement, 0, 0, W, H);
    ctx.restore();
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const W = stage.width, H = stage.height;
  stx.clearRect(0, 0, W, H);
  stx.save();
  tvPath(stx, W, H);
  stx.clip();
  if (!video) { stx.fillStyle = well; stx.fillRect(0, 0, W, H); stx.restore(); return; }
  track(now);
  const showGlasses = tracking && rig.visible;
  if (showGlasses) renderer.render(scene, camera);
  drawScene(stx, W, H, showGlasses);
  stx.restore();
  if (snapPending) { snapPending = false; capture(showGlasses); }
}
requestAnimationFrame(frame);

const photos = [];
function snap() { if (video) snapPending = true; }
$('#shutter').addEventListener('click', snap);

function stamp(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function capture(withGlasses) {
  const fl = $('#flash'); fl.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove('on')));
  const word = state.L.words[state.active] ? state.text.slice(state.L.words[state.active].start, state.L.words[state.active].end) : 'frames';
  const W = stage.width, H = stage.height;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const cx = c.getContext('2d');
  cx.beginPath(); cx.roundRect(0, 0, W, H, Math.min(W, H) * 0.045); cx.clip();
  drawScene(cx, W, H, withGlasses);
  c.toBlob(blob => {
    const d = new Date();
    photos.push({ blob, url: URL.createObjectURL(blob), name: `paintbooth-${word}-${stamp(d)}.png`, date: d });
    renderStack();
  }, 'image/png');
}

function renderStack() {
  const st = $('#stack'); st.innerHTML = '';
  if (!photos.length) {
    st.innerHTML = '<div class="empty"><span>photos land here</span></div>';
    return;
  }
  const last = photos.slice(-3);
  const tilts = [[-7, -10, 6], [5, 8, -3], [0, 0, 0]].slice(3 - last.length);
  last.forEach((p, i) => {
    const im = document.createElement('img'); im.src = p.url; im.alt = '';
    const [rot, dx, dy] = tilts[i];
    im.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
    st.appendChild(im);
  });
  if (photos.length > 1) { const c = document.createElement('span'); c.className = 'count'; c.textContent = photos.length; st.appendChild(c); }
}
const gal = $('#gallery');
/* On phones, hand photos to the system share sheet: "Save Image" there puts them in the Camera Roll / Photos. */
const asFile = p => new File([p.blob], p.name, { type: 'image/png' });
const CAN_SHARE = (() => {
  try { return TOUCH && !!navigator.canShare && navigator.canShare({ files: [new File([new Blob(['x'])], 'x.png', { type: 'image/png' })] }); }
  catch (e) { return false; }
})();
function downloadPhoto(p) { const a = document.createElement('a'); a.href = p.url; a.download = p.name; document.body.appendChild(a); a.click(); a.remove(); }
async function savePhotos(list) {
  if (CAN_SHARE) {
    try { await navigator.share({ files: list.map(asFile) }); return; }
    catch (e) { if (e.name === 'AbortError') return; }        // user closed the sheet: do nothing
  }
  for (const p of list) { downloadPhoto(p); await new Promise(r => setTimeout(r, 250)); }
}

function renderGallery() {
  const grid = $('#gGrid'); grid.innerHTML = '';
  $('#gTitle').textContent = photos.length ? `Photos (${photos.length})` : 'Photos';
  $('#dlAll').style.display = photos.length > 1 ? '' : 'none';
  $('#dlAll').textContent = CAN_SHARE ? 'Save all to Photos' : 'Download all';
  if (!photos.length) { grid.innerHTML = '<div class="g-empty">No photos yet. Press the shutter to take one.</div>'; return; }
  [...photos].reverse().forEach(p => {
    const it = document.createElement('div'); it.className = 'g-item';
    it.innerHTML = `<img src="${p.url}" alt="Photo with glasses"><div class="row"><span>${p.date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}</span><div><a href="${p.url}" download="${p.name}">${CAN_SHARE ? 'Save to Photos' : 'Download'}</a><button>Delete</button></div></div>`;
    it.querySelector('a').addEventListener('click', e => { if (CAN_SHARE) { e.preventDefault(); savePhotos([p]); } });
    it.querySelector('button').addEventListener('click', () => {
      URL.revokeObjectURL(p.url); photos.splice(photos.indexOf(p), 1); renderGallery(); renderStack();
    });
    grid.appendChild(it);
  });
}
$('#stack').addEventListener('click', () => { renderGallery(); gal.showModal(); });
$('#gClose').addEventListener('click', () => gal.close());
gal.addEventListener('click', e => { if (e.target === gal) gal.close(); });
$('#dlAll').addEventListener('click', () => savePhotos([...photos]));

// buttons shouldn't steal focus from the typing field
document.querySelectorAll('.sw:not(.custom), .sets button, #shutter, #stack').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));

/* little logo riding the bottom curve of the TV */
function placeBadge() {
  const wrap = $('#stageWrap'), w = wrap.clientWidth, h = wrap.clientHeight;
  const m = h * 0.016, r = Math.min(w, h) * 0.075, d = 19;
  const svg = $('#badge'); svg.setAttribute('width', w); svg.setAttribute('height', h + 40);
  $('#badgeCurve').setAttribute('d', `M${r},${h - m + d} Q${w / 2},${h + m + d} ${w - r},${h - m + d}`);
}
new ResizeObserver(placeBadge).observe($('#stageWrap'));

/* theme switch */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.6A8 8 0 1 1 9.4 4a6.5 6.5 0 0 0 10.6 10.6Z"/></svg>';
function refreshTheme() {
  $('#theme').innerHTML = isDark() ? SUN : MOON;
  $('#theme').title = isDark() ? 'Light mode' : 'Dark mode';
  well = cssVar('--well');
  drawStrip();
}
$('#theme').addEventListener('click', () => {
  root.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('pb-theme', root.dataset.theme); } catch (e) {}
  refreshTheme();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshTheme);

fitNarrow();
configureStage();

/* ---------- go ---------- */
relayout();
state.active = 0;
txt.setSelectionRange(0, 0);
await document.fonts.ready;
updateAll();
refreshTheme();
renderStack();
lastFit = ''; fitNarrow();
txt.focus({ preventScroll: true });
startCamera();
</script>
