<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glyph Reader</title>
<style>
:root{box-sizing:border-box;--bg:#000;--fg:#fff;--ov:rgba(0,0,0,.7)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#o{position:absolute;left:0;right:0;bottom:0;max-height:45%;overflow:auto;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ov);font:14px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
#o:empty{display:none}
#cam{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;max-width:calc(100% - 16px);z-index:2;font:13px system-ui,sans-serif;color:var(--fg);background:var(--ov);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 6px}
#cam:empty{display:none}
#ui{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font:13px system-ui,sans-serif}
#ui button{font:inherit;color:var(--fg);background:var(--ov);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 10px}
#ui button[aria-pressed=true]{background:#fff;color:#000}
#rst,#map,#st{display:none}
.scan #rst{display:inline-block}.scan #map,.scan #st{display:block}
#map{background:var(--ov);image-rendering:pixelated;border:1px solid rgba(255,255,255,.3);max-width:40vw}
#st{background:var(--ov);padding:2px 6px;border-radius:4px;font:12px ui-monospace,Menlo,monospace}

/* ---------- main interface: the scan map fills the screen, text sits over it in exclusion ---------- */
@font-face{font-family:'ABC ROM';src:url('ABCROMVariable-Trial.ttf') format('truetype-variations'),url('ABCROMVariable-Trial.ttf') format('truetype');font-weight:300 900;font-style:normal;font-display:swap}
#app{--page:#bcbcbc;--line:#2e2e2e;position:fixed;inset:0;z-index:10;background:var(--page);font-family:'ABC ROM',system-ui,sans-serif;
  font-size:clamp(16px,2.6vw + 5px,23px);line-height:1.33;color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}
.debug #app{display:none}
#frame{position:absolute;isolation:isolate;border:1px solid var(--line);overflow:hidden;
  top:max(24px,calc(env(safe-area-inset-top,0px) + 12px));bottom:max(32px,calc(env(safe-area-inset-bottom,0px) + 16px));
  left:clamp(16px,9vw,72px);right:clamp(16px,9vw,72px)}
#m{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#ink{position:absolute;inset:0;mix-blend-mode:exclusion;color:#fff;pointer-events:none}
#modes{position:absolute;z-index:1;top:.85em;left:0;right:0;display:flex;justify-content:center;gap:.75em;font-size:1.1em;pointer-events:auto}
#modes button{font:inherit;color:inherit;background:none;border:0;padding:.1em .05em;cursor:pointer;opacity:.5;text-decoration:none}
#modes button[aria-pressed=true]{opacity:1;text-decoration:underline;text-decoration-thickness:.09em;text-underline-offset:.16em}
#modes button:focus-visible{outline:1px dashed currentColor;outline-offset:3px}
#txt{position:absolute;inset:3.1em 0 0;overflow-y:auto;scrollbar-width:none;padding:3.1em 1.6em 3em;pointer-events:auto;user-select:text;-webkit-user-select:text}
#txt::-webkit-scrollbar{display:none}
#txt p{margin:0;max-width:30em;white-space:pre-wrap;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
#txt p.hint{opacity:.6}
</style></head>
<body>
<video id="v" playsinline muted autoplay></video>
<select id="cam" aria-label="Camera"></select>
<div id="ui"><div><button id="scan" aria-pressed="false">Scan</button> <button id="rst">Reset</button></div><canvas id="map" width="1" height="1"></canvas><div id="st"></div></div>
<pre id="o"></pre>
<div id="app" lang="en">
  <div id="frame">
    <canvas id="m" aria-hidden="true"></canvas>
    <div id="ink">
      <div id="modes" role="group" aria-label="Mode"><button id="mScan" aria-pressed="true">Scan</button><button id="mSpot" aria-pressed="false">Spot</button></div>
      <div id="txt" aria-live="polite"><p class="hint"></p></div>
    </div>
  </div>
</div>
<script>
const v=document.getElementById('v'),out=document.getElementById('o');
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
let lastT=0,SCALE=0,SCN=0,SCW=0,MISS=0,LAT=null; // SCALE: processing scale learned from the last good frame (0 = full)

const camSel=document.getElementById('cam');let looping=false;
const savedCam=()=>{try{return localStorage.getItem('glyphCam')||'';}catch(e){return '';}};
async function listCams(){ // labels are only available after permission is granted
  try{const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const cur=v.srcObject&&v.srcObject.getVideoTracks()[0],curId=cur&&cur.getSettings().deviceId;
    camSel.innerHTML='';
    ds.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||('Camera '+(i+1));camSel.appendChild(o);});
    if(curId)camSel.value=curId;
  }catch(e){}}
async function start(id){
  id=id||savedCam();
  if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}
  const base={width:{ideal:3840},height:{ideal:2160}};
  try{
    let s;
    try{s=await navigator.mediaDevices.getUserMedia({video:id?{...base,deviceId:{exact:id}}:{...base,facingMode:{ideal:'environment'}},audio:false});}
    catch(e){if(!id)throw e;s=await navigator.mediaDevices.getUserMedia({video:{...base,facingMode:{ideal:'environment'}},audio:false});}
    v.srcObject=s;await v.play();SCALE=0;MISS=0;
    try{const tr=s.getVideoTracks()[0];await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}
    await listCams();
    if(!looping){looping=true;loop();}
  }catch(e){out.textContent='camera unavailable - tap to retry';}
}
camSel.onchange=()=>{try{localStorage.setItem('glyphCam',camSel.value);}catch(e){}out.textContent='';start(camSel.value);};
try{navigator.mediaDevices.addEventListener('devicechange',listCams);}catch(e){}
out.onclick=()=>{if(!v.srcObject)start();};
const scanBtn=document.getElementById('scan'),mapC=document.getElementById('map'),stEl=document.getElementById('st');
let SCANNING=false,SPOT=null;
scanBtn.onclick=()=>{SCANNING=!SCANNING;scanBtn.setAttribute('aria-pressed',SCANNING);document.body.classList.toggle('scan',SCANNING);out.textContent='';if(SCANNING&&!SG)stEl.textContent='sweep the camera over the sheet';};
document.getElementById('rst').onclick=()=>{scanReset();out.textContent='';stEl.textContent='sweep the camera over the sheet';drawMap(null);};
function loop(){
  if(v.videoWidth){
    let t='';try{t=process();}catch(e){}
    if(SCANNING){scanFlush(false);if(SG)t=SG.text;if(!t&&SG===null)stEl.textContent='sweep the camera over the sheet';}
    const now=Date.now();
    if(t){out.textContent=t;lastT=now;MISS=0;}else{if(++MISS>=3)SCALE=0;if(now-lastT>1200)out.textContent='';}
  }
  setTimeout(loop,30);
}

/* ---------- helpers ---------- */
const TAU=Math.PI*2,wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const POOL={};
function pool(k,Ty,n){let b=POOL[k];if(!b||b.length!==n||!(b instanceof Ty))b=POOL[k]=new Ty(n);return b;}
function integ(a,W,H,key){const S=W+1,I=key?pool(key,Float64Array,S*(H+1)):new Float64Array(S*(H+1));
  for(let y=0;y<H;y++){let r=0;const o=y*W,p=(y+1)*S,q=y*S;for(let x=0;x<W;x++){r+=a[o+x];I[p+x+1]=I[q+x+1]+r;}}return I;}
function boxSum(I,S,x0,y0,x1,y1){return I[y1*S+x1]-I[y0*S+x1]-I[y1*S+x0]+I[y0*S+x0];}
function fft1(re,im,n,off,st){ // in-place radix-2 on strided data
  for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;
    if(i<j){const a=off+i*st,c=off+j*st;let t=re[a];re[a]=re[c];re[c]=t;t=im[a];im[a]=im[c];im[c]=t;}}
  for(let len=2;len<=n;len<<=1){const ang=-TAU/len,wr=Math.cos(ang),wi=Math.sin(ang),h=len>>1;
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let k=0;k<h;k++){const a=off+(i+k)*st,b=off+(i+k+h)*st;
        const xr=re[b]*cr-im[b]*ci,xi=re[b]*ci+im[b]*cr;
        re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi;
        const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t;}}}}
function basis(xn,yn,o){o[0]=1;o[1]=xn;o[2]=yn;o[3]=xn*xn;o[4]=xn*yn;o[5]=yn*yn;o[6]=xn*xn*xn;o[7]=xn*xn*yn;o[8]=xn*yn*yn;o[9]=yn*yn*yn;return o;}
function polyRow(c,yn){ // cubic in xn for fixed yn: returns [a0,a1,a2,a3]
  return [c[0]+c[2]*yn+c[5]*yn*yn+c[9]*yn*yn*yn, c[1]+c[4]*yn+c[8]*yn*yn, c[3]+c[7]*yn, c[6]];}
function solve(A,b,n){ // gaussian elimination, A n*n row-major
  for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r*n+i])>Math.abs(A[p*n+i]))p=r;
    if(Math.abs(A[p*n+i])<1e-12)return null;
    if(p!==i){for(let c=0;c<n;c++){const t=A[i*n+c];A[i*n+c]=A[p*n+c];A[p*n+c]=t;}const t=b[i];b[i]=b[p];b[p]=t;}
    for(let r=i+1;r<n;r++){const f=A[r*n+i]/A[i*n+i];if(!f)continue;for(let c=i;c<n;c++)A[r*n+c]-=f*A[i*n+c];b[r]-=f*b[i];}}
  const x=new Float64Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i*n+c]*x[c];x[i]=s/A[i*n+i];}return x;}
function inkMap3(px,W,x0,y0,x1,y1,oR,oG,oB,oM,ring,col){ // local 25x25 mean minus value, for R,G,B at once (+ their max)
  const R=12,w=x1-x0,w3=3*w,NR=2*R+2;
  const hrow=y=>{let a=0,b=0,c=0;const o=y*W,h=(y%NR)*w3;
    for(let x=x0;x<Math.min(x1,x0+R);x++){const i=4*(o+x);a+=px[i];b+=px[i+1];c+=px[i+2];}
    for(let x=x0,k=h;x<x1;x++,k+=3){if(x+R<x1){const i=4*(o+x+R);a+=px[i];b+=px[i+1];c+=px[i+2];}
      if(x-R-1>=x0){const i=4*(o+x-R-1);a-=px[i];b-=px[i+1];c-=px[i+2];}ring[k]=a;ring[k+1]=b;ring[k+2]=c;}};
  col.fill(0);
  for(let y=y0;y<Math.min(y1,y0+R);y++){hrow(y);const h=(y%NR)*w3;for(let k=0;k<w3;k++)col[k]+=ring[h+k];}
  const rc=new Float64Array(w);for(let x=x0;x<x1;x++)rc[x-x0]=1/(Math.min(x1,x+R+1)-Math.max(x0,x-R));
  for(let y=y0;y<y1;y++){
    if(y+R<y1){hrow(y+R);const h=((y+R)%NR)*w3;for(let k=0;k<w3;k++)col[k]+=ring[h+k];}
    if(y-R-1>=y0){const h=((y-R-1)%NR)*w3;for(let k=0;k<w3;k++)col[k]-=ring[h+k];}
    const ry=1/(Math.min(y1,y+R+1)-Math.max(y0,y-R)),o=y*W;
    for(let x=x0,k=0;x<x1;x++,k+=3){const f=rc[x-x0]*ry,q=o+x,i=4*q;
      let r=col[k]*f-px[i],g=col[k+1]*f-px[i+1],b=col[k+2]*f-px[i+2];r=r>0?r:0;g=g>0?g:0;b=b>0?b:0;
      oR[q]=r;oG[q]=g;oB[q]=b;oM[q]=r>g?(r>b?r:b):(g>b?g:b);}}}
const median=a=>{if(!a.length)return 0;const s=Float64Array.from(a).sort();return s[s.length>>1];};

/* ---------- main ---------- */
function process(){
  const vw=v.videoWidth,vh=v.videoHeight,cap=Math.min(1,Math.sqrt(8.3e6/(vw*vh)));
  const sc=SCALE?Math.min(cap,SCALE):cap,W=Math.round(vw*sc),H=Math.round(vh*sc),N=W*H;
  cv.width=W;cv.height=H;cx.drawImage(v,0,0,W,H);
  const px=cx.getImageData(0,0,W,H).data,g=pool('g',Uint8Array,N);
  // geometry uses the darkest channel, so every ink (even yellow) reads as a dark stroke
  for(let i=0;i<N;i++){const r=px[4*i],gg=px[4*i+1],b=px[4*i+2];g[i]=r<gg?(r<b?r:b):(gg<b?gg:b);}

  // 1) find the glyph block: 40px tiles with strong 4-fold edge symmetry (/ and \ strokes) but weak 2-fold (not stripes)
  const T=40,tw=Math.floor(W/T),th=Math.floor(H/T),NT=tw*th;
  const R4=new Float64Array(NT),I4=new Float64Array(NT),R2=new Float64Array(NT),I2=new Float64Array(NT),MM=new Float64Array(NT),CC=new Float64Array(NT);
  // orientation per color channel: in each channel every cell shows a single stroke (one per ink layer), even where
  // differently colored strokes cross; for black-only prints all three channels see the same thing
  const W4=4*W;
  // gradient structure per tile; a11..a22 whiten the gradients (see below), identity for a normal frame
  let a11=1,a12=0,a22=1,ph=0;
  const ok=new Uint8Array(NT),C4=new Float64Array(NT);
  function tiles(){R4.fill(0);I4.fill(0);R2.fill(0);I2.fill(0);MM.fill(0);CC.fill(0);ok.fill(0);C4.fill(0);
    for(let y=1;y<th*T-1;y+=2){const ro=((y/T)|0)*tw;
      for(let x=1;x<tw*T-1;x+=2){const q=ro+((x/T)|0);let hit=0;
        for(let ch=0,i=4*(y*W+x);ch<3;ch++,i++){const gx0=px[i+4]-px[i-4],gy0=px[i+W4]-px[i-W4],gx=a11*gx0+a12*gy0,gy=a12*gx0+a22*gy0,m=gx*gx+gy*gy;if(m<400)continue;
          const ar=gx*gx-gy*gy,ai=2*gx*gy;R4[q]+=(ar*ar-ai*ai)/m;I4[q]+=2*ar*ai/m;R2[q]+=ar;I2[q]+=ai;MM[q]+=m;hit=1;}
        CC[q]+=hit;}}
    // hysteresis: strong tiles (clear 4-fold strokes) seed the block, weaker tiles with the same stroke angle may join it
    let sr=0,si=0;
    for(let q=0;q<NT;q++){if(CC[q]<T*T/4*.08||Math.hypot(R2[q],I2[q])/MM[q]>=.45)continue;
      const c4=C4[q]=Math.hypot(R4[q],I4[q])/MM[q];if(c4>.12){sr+=R4[q]*c4;si+=I4[q]*c4;}}
    ph=Math.atan2(si,sr);   // dominant stroke angle (x4); clutter rarely agrees with it
    for(let q=0;q<NT;q++)if(C4[q]>.05&&Math.abs(wrap(Math.atan2(I4[q],R4[q])-ph))<.6)ok[q]=C4[q]>.12?2:1;}
  let lab=new Int32Array(NT),bl=0,bs=0;
  function labelBlock(){lab.fill(0);bl=0;bs=0;let nl=0;
    for(let q0=0;q0<NT;q0++){if(ok[q0]!==2||lab[q0])continue;nl++;const st=[q0];lab[q0]=nl;let n=0,nStrong=0;
      while(st.length){const q=st.pop();n++;if(ok[q]===2)nStrong++;const x=q%tw,y=(q/tw)|0;
        if(x>0&&ok[q-1]&&!lab[q-1]){lab[q-1]=nl;st.push(q-1);}
        if(x<tw-1&&ok[q+1]&&!lab[q+1]){lab[q+1]=nl;st.push(q+1);}
        if(y>0&&ok[q-tw]&&!lab[q-tw]){lab[q-tw]=nl;st.push(q-tw);}
        if(y<th-1&&ok[q+tw]&&!lab[q+tw]){lab[q+tw]=nl;st.push(q+tw);}}
      if(n>bs&&nStrong>=10){bs=n;bl=nl;}}}
  tiles();labelBlock();
  // no glyph block? motion blur may have wiped out edges along the direction of travel, so / and \ strokes stop
  // looking 4-fold symmetric. Undo that by whitening gradients with the frame's overall edge anisotropy and look again
  if(bs<10){let sxx=0,syy=0,sxy=0;for(let y=1;y<H-1;y+=4)for(let x=1;x<W-1;x+=4)for(let ch=0,i=4*(y*W+x);ch<3;ch++,i++){
      const gx=px[i+4]-px[i-4],gy=px[i+W4]-px[i-W4],m=gx*gx+gy*gy;if(m<400)continue;sxx+=gx*gx/m;syy+=gy*gy/m;sxy+=gx*gy/m;}
    const tr=sxx+syy,dd=Math.sqrt((sxx-syy)*(sxx-syy)/4+sxy*sxy),l1=tr/2+dd,l2=tr/2-dd;
    if(tr>0&&l2>0&&l1/l2>1.25){const r=Math.min(4,l1/l2),an=.5*Math.atan2(2*sxy,sxx-syy),c=Math.cos(an),sn=Math.sin(an),k1=1/Math.sqrt(r),k2=Math.sqrt(r);
      a11=k1*c*c+k2*sn*sn;a22=k1*sn*sn+k2*c*c;a12=(k1-k2)*c*sn;   // scale the strong axis down and the weak one up (det 1)
      tiles();labelBlock();}}
  // while scanning, a motion-blurred frame loses its stroke-angle signal; fall back on the grid seen moments ago
  const prior=SCANNING&&LAT&&Date.now()-LAT.t<4000?LAT:null;let usedPrior=false;
  if(bs<10&&prior){for(let q=0;q<NT;q++)ok[q]=CC[q]>T*T/4*.15?2:0;labelBlock();usedPrior=bs>=10;}
  if(bs<10)return '';
  let th0=usedPrior?prior.th0:wrap(ph-Math.PI)/4;
  if(!usedPrior&&(a12||a11!==1)){   // map the whitened stroke normals back to image space; the lattice axis bisects them
    const det=a11*a22-a12*a12,inv=(x,y)=>{const u=(a22*x-a12*y)/det,v=(-a12*x+a11*y)/det,n=Math.hypot(u,v);return [u/n,v/n];};
    const n1=inv(Math.cos(th0+Math.PI/4),Math.sin(th0+Math.PI/4)),n2=inv(Math.cos(th0-Math.PI/4),Math.sin(th0-Math.PI/4));
    const a=Math.atan2(n1[1]+n2[1],n1[0]+n2[0]);th0=wrap(4*a)/4;}
  const inT=(tx,ty)=>tx>=0&&ty>=0&&tx<tw&&ty<th&&lab[ty*tw+tx]===bl;
  const inB=(x,y)=>inT((x/T)|0,(y/T)|0)&&x<tw*T&&y<th*T;
  let tx0=1e9,tx1=-1,ty0=1e9,ty1=-1,scx=0,scy=0;
  for(let q=0;q<NT;q++)if(lab[q]===bl){const x=q%tw,y=(q/tw)|0;tx0=Math.min(tx0,x);tx1=Math.max(tx1,x);ty0=Math.min(ty0,y);ty1=Math.max(ty1,y);scx+=x;scy+=y;}
  const cxb=(scx/bs+.5)*T,cyb=(scy/bs+.5)*T;

  // per-channel ink (darker than local mean) inside the block's region: R sees cyan, G magenta, B yellow; geometry = max
  const rx0=Math.max(0,(tx0-1)*T),ry0=Math.max(0,(ty0-1)*T),rx1=Math.min(W,(tx1+2)*T),ry1=Math.min(H,(ty1+2)*T);
  const rw=rx1-rx0,rh=ry1-ry0;
  const kR=pool('kR',Uint8ClampedArray,N),kG=pool('kG',Uint8ClampedArray,N),kB=pool('kB',Uint8ClampedArray,N),ink=pool('ink',Uint8Array,N);
  inkMap3(px,W,rx0,ry0,rx1,ry1,kR,kG,kB,ink,pool('ring',Uint16Array,26*3*rw),pool('col',Int32Array,3*rw));

  // 2) lattice vectors from a 2D FFT of the block's ink, peaks searched in narrow cones around the stroke axes
  const span=Math.min((ty1-ty0+1)*T,(tx1-tx0+1)*T);
  let NF=span>=200?256:128;while(NF>Math.min(W,H))NF>>=1;
  const fx0=Math.round(Math.min(Math.max(cxb-NF/2,0),W-NF)),fy0=Math.round(Math.min(Math.max(cyb-NF/2,0),H-NF));
  const re=pool('re',Float64Array,NF*NF).fill(0),im=pool('im',Float64Array,NF*NF).fill(0),hn=new Float64Array(NF);
  for(let k=0;k<NF;k++)hn[k]=.5-.5*Math.cos(TAU*k/(NF-1));
  let mu=0,mc=0;
  for(let y=0;y<NF;y++)for(let x=0;x<NF;x++)if(inB(fx0+x,fy0+y)){mu+=ink[(fy0+y)*W+fx0+x];mc++;}

  const toBytes=(s,o,n0,n1)=>{const a=new Int16Array(Math.max(0,Math.floor((n1-n0-o)/8)));
    for(let q=n0+o,k=0;k<a.length;q+=8,k++){let B=0,u=0;for(let z=0;z<8;z++){const b=s[q+z];if(!b)u=1;B=(B<<1)|(b>0?1:0);}a[k]=u?-1:B;}return a;};
  const score=by=>{let k=0,n=0;for(let i=0;i<by.length;i++)if(by[i]>=0){n++;k+=PR[by[i]];}return n?k/n:0;};
  const dec=by=>{let outS='',run=[];const flush=()=>{if(run.length){outS+=new TextDecoder('utf-8').decode(new Uint8Array(run));run=[];}};
    for(let i=0;i<by.length;i++){if(by[i]<0){flush();outS+='░';}else run.push(by[i]);}flush();return outS;};
  let best={sc:-1,make:()=>''},cur=lay;
  for(let r=0;r<4;r++){
    for(const XL of [cur,cur.map(mir)]){const per=XL[0].h*XL[0].w,all=new Int8Array(per*L);XL.forEach((X,l)=>all.set(X.m,l*per));
      for(let o=0;o<8;o++){const by=toBytes(all,o,0,all.length),sc=score(by);if(sc>best.sc)best={sc,make:()=>dec(by)};}
      if(L>1){let k=0,tot=0;const parts=[];
        for(let l=0;l<L;l++){let bb=null,bq=-1;for(let o=0;o<8;o++){const by=toBytes(all,o,l*per,(l+1)*per),q=score(by);if(q>bq){bq=q;bb=by;}}
          k+=bq*bb.length;tot+=bb.length;parts.push(bb);}
        if(k/tot>best.sc+.003)best={sc:k/tot,make:()=>parts.map(dec).join('')};}
      // rows read one by one, each with its own byte alignment: survives a sheet whose full width hasn't been seen yet
      // (a missing column throws a continuous read out of step on every row); a byte split across two rows is lost
      {const w=XL[0].w,h=XL[0].h,rows=[];let k=0,tot=0;
        for(let l=0;l<L;l++)for(let i=0;i<h;i++){const n0=l*per+i*w;let bb=null,bq=-1;
          for(let o=0;o<8;o++){const by=toBytes(all,o,n0,n0+w),q=score(by);if(q>bq){bq=q;bb=by;}}
          if(bb&&bb.length){k+=bq*bb.length;tot+=bb.length;rows.push(bb);}}
        if(tot&&k/tot>best.sc+.06)best={sc:k/tot-.06,make:()=>rows.map(dec).join('')};}}
    cur=cur.map(rot);}
  return best.make().replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g,'·');}
function drawMap(last){
  if(!SG){mapC.width=mapC.height=1;return;}
  const {y0,y1,x0,x1}=SG,h=y1-y0+1,w=x1-x0+1,k=Math.max(1,Math.floor(160/Math.max(h,w)));
  mapC.width=w*k;mapC.height=h*k;const c=mapC.getContext('2d'),im=c.createImageData(w,h);
  for(let i=0;i<h;i++)for(let j=0;j<w;j++){const n=SG.cnt[(i+y0)*GS+j+x0],q=4*(i*w+j),b=n?Math.min(255,110+40*n):25;im.data[q]=im.data[q+1]=im.data[q+2]=b;im.data[q+3]=255;}
  const t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').putImageData(im,0,0);
  c.imageSmoothingEnabled=false;c.drawImage(t,0,0,w*k,h*k);
  if(last){c.strokeStyle='#f0f';c.lineWidth=2;c.strokeRect((last.dx-x0)*k,(last.dy-y0)*k,last.w*k,last.h*k);}}
/* ---------- main interface ---------- */
const mC=document.getElementById('m'),mX=mC.getContext('2d'),txtEl=document.getElementById('txt'),frameEl=document.getElementById('frame');
const bScan=document.getElementById('mScan'),bSpot=document.getElementById('mSpot');
// cell tones: unseen stays dark, each extra pass lightens a cell, the camera's current patch is white
const TONE=[0x3a,0xb4,0xc2,0xcd,0xd8],LIVE=0xff;
let paintKey='',shown=null,spotTaps=[],scanTapT=0;
function setMode(scan){
  if(SCANNING!==scan)scanBtn.onclick();   // same switch the debug view uses, so both stay in step
  bScan.setAttribute('aria-pressed',scan);bSpot.setAttribute('aria-pressed',!scan);paintKey='';shown=null;}
bScan.onclick=()=>{const now=Date.now();
  if(SCANNING&&now-scanTapT<450){scanReset();out.textContent='';stEl.textContent='sweep the camera over the sheet';drawMap(null);paintKey='';}  // double tap: start over
  scanTapT=now;setMode(true);};
bSpot.onclick=()=>{const now=Date.now();spotTaps=spotTaps.filter(t=>now-t<1500);spotTaps.push(now);setMode(false);
  if(spotTaps.length>=3){spotTaps=[];document.body.classList.add('debug');}};   // three taps on Spot: the original interface
txtEl.onclick=()=>{if(!v.srcObject)start();};
function fitCanvas(){const r=frameEl.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));
  if(mC.width!==w||mC.height!==h){mC.width=w;mC.height=h;paintKey='';}}
function paintCells(h,w,tone){   // a cell grid stretched over the whole frame
  const im=new ImageData(w,h),d=im.data;
  for(let i=0;i<h;i++)for(let j=0;j<w;j++){const q=4*(i*w+j),b=tone(i,j);d[q]=d[q+1]=d[q+2]=b;d[q+3]=255;}
  const t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').putImageData(im,0,0);
  mX.imageSmoothingEnabled=false;mX.drawImage(t,0,0,mC.width,mC.height);}
function paint(){
  if(document.body.classList.contains('debug'))return;
  fitCanvas();
  if(SCANNING){
    const S=SG,key=S?`${S.frames}|${S.lost}|${S.y0},${S.x0},${S.y1},${S.x1}`:'none';
    if(key!==paintKey){paintKey=key;
      if(!S){mX.fillStyle='#3a3a3a';mX.fillRect(0,0,mC.width,mC.height);}
      else{const {y0,y1,x0,x1}=S,h=y1-y0+1,w=x1-x0+1,L=S.last;
        paintCells(h,w,(i,j)=>{const y=i+y0,x=j+x0,n=S.cnt[y*GS+x];
          if(L&&n&&y>=L.dy&&y<L.dy+L.h&&x>=L.dx&&x<L.dx+L.w)return LIVE;
          return TONE[Math.min(n,TONE.length-1)];});}}}
  else{const P=SPOT,fresh=P&&Date.now()-P.t<1200,key=fresh?'s'+P.t:'off';
    if(key!==paintKey){paintKey=key;
      if(!fresh){mX.fillStyle='#3a3a3a';mX.fillRect(0,0,mC.width,mC.height);}
      else paintCells(P.h,P.w,(i,j)=>{const c=P.m[i*P.w+j];return c===2?LIVE:c===1?TONE[2]:TONE[0];});}}
  // text: the decoded stream, or a hint while there is none
  let t=out.textContent,hint=false;
  if(!t){hint=true;t=!v.srcObject&&looping===false?'Allow the camera to begin.':SCANNING?'Sweep the camera slowly over the sheet.':'Point the camera at a glyph sheet.';}
  if(/camera unavailable/.test(t)){hint=true;t='Camera unavailable. Tap to try again.';}
  const k=(hint?'h':'t')+t;
  if(k!==shown){shown=k;const p=txtEl.firstElementChild;p.className=hint?'hint':'';
    p.textContent=hint?t:t.replace(/░+/g,m=>' '+'·'.repeat(Math.min(3,m.length))+' ');}
}
(function tick(){try{paint();}catch(e){}requestAnimationFrame(tick);})();
window.addEventListener('resize',()=>{paintKey='';});
// scan is the default mode
SCANNING=true;scanBtn.setAttribute('aria-pressed','true');document.body.classList.add('scan');stEl.textContent='sweep the camera over the sheet';
start();
</script>
